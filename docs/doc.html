<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3efe8" />
  <meta name="description" content="Dollars Archive 한국어화 기술 문서" />
  <title>Dollars Archive 문서</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body data-page="doc">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">← 문서 아카이브</a>
      <nav class="top-actions">
        <a id="raw-link" href="#" target="_blank" rel="noreferrer">GitHub 원문 ↗</a>
        <a href="https://github.com/Dollars-Archive/Dollars-Archive-kr-localization-archive" target="_blank" rel="noreferrer">저장소 ↗</a>
      </nav>
    </div>
  </header>

  <main class="reader-shell">
    <section class="doc-hero">
      <p class="eyebrow">DOLLARS ARCHIVE · KNOWLEDGE NOTE</p>
      <h1 id="page-title">문서를 불러오는 중…</h1>
      <p id="page-path" class="doc-path"></p>
    </section>

    <div class="reader-layout">
      <aside class="toc-card">
        <div class="toc-title">목차</div>
        <nav id="toc" class="toc"></nav>
      </aside>
      <article class="reader-card">
        <div id="status" class="status">문서를 불러오는 중…</div>
        <div id="reader" class="reader" hidden></div>
      </article>
    </div>
  </main>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
