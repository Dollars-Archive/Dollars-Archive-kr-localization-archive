<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="게임명 한국어 패치 적용 방법">
  <title>게임명 · 한국어 패치 설치 가이드</title>
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="./">설치 가이드</a>
    <nav class="top-actions" aria-label="다운로드 및 저장소">
      <a id="release-link" hidden>Release / 다운로드 ↗</a>
      <a id="repo-link" hidden>GitHub ↗</a>
    </nav>
  </div></header>
  <main class="reader-shell">
    <section class="doc-hero">
      <p class="eyebrow">INSTALLATION GUIDE</p>
      <h1 id="title">한국어 패치 설치 가이드</h1>
      <div id="platforms" class="hero-badges"></div>
    </section>
    <div class="reader-layout">
      <aside class="toc-card"><div class="toc-title">목차</div><nav id="toc" class="toc" aria-label="설치 가이드 목차"></nav></aside>
      <article class="reader-card">
        <div id="status" class="status" role="status">설치 가이드를 불러오는 중입니다.</div>
        <div id="reader" class="reader" hidden></div>
      </article>
    </div>
    <noscript><p>JavaScript를 켜거나 저장소의 INSTALL.md를 확인해 주세요.</p></noscript>
  </main>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
