name: Fix bootstrap numbering

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fix-bootstrap-numbering.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix numbering
        run: python scripts/one-shot-fix-bootstrap-numbering.py

      - name: Commit fix and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-bootstrap-numbering.yml scripts/one-shot-fix-bootstrap-numbering.py
          git add CODEX-LOCALIZATION-BOOTSTRAP.md
          git diff --cached --check
          git commit -m "docs: fix bootstrap startup numbering"
          git push origin HEAD:main
