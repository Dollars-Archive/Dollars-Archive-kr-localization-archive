name: Add WebGPT usage examples to bootstrap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-webgpt-usage-examples-20260913.yml
permissions:
  contents: write
concurrency:
  group: bootstrap-webgpt-usage-examples-20260913
  cancel-in-progress: false
jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch WebGPT usage section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('CODEX-LOCALIZATION-BOOTSTRAP.md')
          data = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          expected = '612cf8b5e6147a02c8c66f0a963a3b41ecedbbc6'
          if blob != expected:
              raise SystemExit(f'bootstrap changed concurrently: {blob} != {expected}')

          text = data.decode('utf-8')
          old = '''사용자가 “webgpt xh로 분석해”, “webgpt p로 검토해”, “이 부분은 웹 GPT에 맡겨”처럼 지정했을 때만 그 작업 범위에 Web GPT를 사용합니다. 한 번의 지정은 후속 모든 작업의 자동 호출 허가가 아닙니다. 설치되어 있다는 이유로 실행하지 않습니다.\n\nLuna XHIGH는 정해진 저위험 반복 작업의 보조이며 병렬 호출 의무는 없습니다. Astra·로컬 Sol XHIGH 등 고비용 모델로의 변경/추가 호출은 사용자 지정 또는 명시 승인 뒤에만 합니다. 사용자가 선택한 현재 모델·강도를 임의로 상향하지 않습니다.\n'''

          new = '''사용자가 WebGPT를 명시적으로 지정했을 때만 그 작업 범위에 Web GPT를 사용합니다. 한 번의 지정은 후속 모든 작업의 자동 호출 허가가 아니며, 설치되어 있다는 이유만으로 실행하지 않습니다.\n\n## WebGPT 명시 호출 방법\n\nWebGPT는 사용자가 원하는 작업만 선택적으로 외부 Web ChatGPT에 위임하기 위한 호출 방식입니다. 평소 작업은 계속 Codex GPT-5.6 Sol / Medium이 직접 수행합니다.\n\n### Extra High 모드\n\nWebGPT의 **Extra High** 모드를 사용할 때는 다음 형식을 기본으로 합니다.\n\n```text\nwebgpt xh "할 일"\n```\n\n`xh`는 `Extra High`를 의미합니다. 예:\n\n```text\nwebgpt xh "현재 패처의 저장 구조를 분석하고, 세이브 손상 가능성과 수정 후보를 정리해"\n```\n\n```text\nwebgpt xh "이 검수 프로그램의 CSV import 경로를 분석하고 중복 row_key 처리 문제를 찾아줘"\n```\n\n### Pro 모드\n\nWebGPT의 **Pro** 모드를 사용할 때는 다음 형식을 기본으로 합니다.\n\n```text\nwebgpt p "할 일"\n```\n\n`p`는 `Pro`를 의미합니다. 예:\n\n```text\nwebgpt p "현재 패처 아키텍처를 독립적으로 검토하고 구조적 위험과 대안을 제시해"\n```\n\n```text\nwebgpt p "이 런타임 프리징 원인을 기존 가정에 얽매이지 말고 처음부터 재검토해"\n```\n\n### WebGPT subagent 병렬 작업\n\n서로 독립적인 작업을 동시에 진행하고 싶을 때는 사용자가 WebGPT subagent 사용과 병렬 실행을 함께 지정할 수 있습니다. 예:\n\n```text\nsubagent로 webgpt xh 써서 패처 구조 분석, 검수 프로그램 UI 개선안, CSV import 검증 로직을 병렬로 개발해\n```\n\n또는 작업 범위를 더 명확히 나누어 지정할 수 있습니다.\n\n```text\nsubagent로 webgpt xh 써서 아래 작업을 병렬로 진행해.\n1. 패처 구조 분석\n2. 검수 프로그램 UI 개선안 작성\n3. CSV import 검증 로직 구현\n```\n\n병렬 실행은 **서로 독립적인 하위 작업**에만 사용합니다. 같은 파일을 동시에 수정하거나, 앞 작업 결과가 다음 작업의 입력이 되는 경우에는 병렬로 실행하지 않고 순차 처리합니다. 각 subagent의 수정 범위가 겹치지 않도록 작업 소유권을 분리하고, 최종 결과는 호스트 Codex가 실제 diff·테스트·산출물에 대조해 통합합니다.\n\n### 호출 해석 규칙\n\n- `webgpt xh "..."` → 지정한 작업을 WebGPT Extra High로 수행\n- `webgpt p "..."` → 지정한 작업을 WebGPT Pro로 수행\n- `subagent로 webgpt xh 써서 ... 병렬로 ...` → 독립 하위 작업을 WebGPT Extra High subagent로 분리해 병렬 수행\n- 사용자가 WebGPT를 명시하지 않은 일반 작업 → Codex GPT-5.6 Sol / Medium이 직접 수행\n- 한 번의 WebGPT 지정은 그 문장에서 지정한 작업 범위에만 유효하며, 후속 작업의 자동 호출 권한으로 확대하지 않음\n- 요청한 모드가 실제로 선택되었는지 확인하며, 다른 모드나 다른 실행기로 조용히 대체하지 않음\n\nLuna XHIGH는 정해진 저위험 반복 작업의 보조이며 병렬 호출 의무는 없습니다. Astra·로컬 Sol XHIGH 등 고비용 모델로의 변경/추가 호출은 사용자 지정 또는 명시 승인 뒤에만 합니다. 사용자가 선택한 현재 모델·강도를 임의로 상향하지 않습니다.\n'''

          if text.count(old) != 1:
              raise SystemExit(f'anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify bootstrap update
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('CODEX-LOCALIZATION-BOOTSTRAP.md').read_text(encoding='utf-8')
          required = [
              '## WebGPT 명시 호출 방법',
              'webgpt xh "할 일"',
              '`xh`는 `Extra High`를 의미합니다.',
              'webgpt p "할 일"',
              '`p`는 `Pro`를 의미합니다.',
              'subagent로 webgpt xh 써서 패처 구조 분석, 검수 프로그램 UI 개선안, CSV import 검증 로직을 병렬로 개발해',
              '병렬 실행은 **서로 독립적인 하위 작업**에만 사용합니다.',
              '사용자가 WebGPT를 명시하지 않은 일반 작업 → Codex GPT-5.6 Sol / Medium이 직접 수행',
              '다른 모드나 다른 실행기로 조용히 대체하지 않음',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'missing required text: {missing}')

          assert text.index('### Extra High 모드') < text.index('### Pro 모드') < text.index('### WebGPT subagent 병렬 작업') < text.index('### 호출 해석 규칙')
          assert '웹쫀쿠' not in text
          print('WEBGPT_USAGE_EXAMPLES_VERIFY_OK')
          PY

      - name: Commit bootstrap and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-webgpt-usage-examples-20260913.yml
          git add CODEX-LOCALIZATION-BOOTSTRAP.md
          git diff --cached --check
          git commit -m "docs: document explicit WebGPT invocation patterns"
          git push origin HEAD:main
