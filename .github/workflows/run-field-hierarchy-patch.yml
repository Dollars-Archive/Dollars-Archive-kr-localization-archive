name: Run field hierarchy routing patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run patch script stored in the one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          src = Path('.github/workflows/one-shot-field-hierarchy-routing.yml').read_text(encoding='utf-8')
          m = re.search(r"python - <<'PY'\n(?P<body>.*?)\n          PY", src, flags=re.S)
          if not m:
              raise SystemExit('Could not extract patch script from one-shot workflow')
          body = textwrap.dedent(m.group('body'))
          compile(body, '<field-hierarchy-patch>', 'exec')
          exec(body, {'__name__': '__main__'})
          PY

      - name: Commit changes and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-field-hierarchy-routing.yml
          rm -f .github/workflows/run-field-hierarchy-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CODEX-LOCALIZATION-BOOTSTRAP.md workflow/SOL-LUNA-AGENT-POLICY.md workflow/PROJECT-OPERATING-MODEL.md templates/AGENTS.template.md .github/workflows/one-shot-field-hierarchy-routing.yml .github/workflows/run-field-hierarchy-patch.yml
          git diff --cached --check
          git commit -m "Adopt field-hierarchy model routing"
          git push
