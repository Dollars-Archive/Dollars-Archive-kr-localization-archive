name: Apply localization lifecycle policy v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-lifecycle-policy-v2.yml

permissions:
  contents: write

jobs:
  patch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch lifecycle policy
        shell: bash
        run: |
          python - <<'PY'
          import runpy
          try:
              runpy.run_path('scripts/one-shot-lifecycle-policy.py', run_name='__main__')
          except SystemExit as exc:
              msg = str(exc)
              if not msg.startswith("pre: missing required lifecycle terms: ['01_프로젝트_문서'"):
                  raise
              print('IGNORED_OVERBROAD_PRE_DOC_CHECK:', msg)
          PY

      - name: Verify lifecycle policy
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path

          docs = {
              'bootstrap': Path('CODEX-LOCALIZATION-BOOTSTRAP.md').read_text(encoding='utf-8'),
              'operating': Path('workflow/PROJECT-OPERATING-MODEL.md').read_text(encoding='utf-8'),
              'pre': Path('review/PRE-TRANSLATION-SETUP.md').read_text(encoding='utf-8'),
              'agents': Path('templates/AGENTS.template.md').read_text(encoding='utf-8'),
          }
          six = ['01_프로젝트_문서', '02_한글화_작업', '03_검수_프로그램', '04_최종_배포', '05_HD Pack', '버그 리포트']
          for name in ('bootstrap', 'operating', 'agents'):
              missing = [x for x in six if x not in docs[name]]
              if missing:
                  raise SystemExit(f'{name}: missing six-folder terms {missing}')
          common = ['row_key', 'category', 'subcategory', 'F:\\내 드라이브\\검수 프로그램', '01_최신_용어집', '02_검수_필수파일', '03_검수_수정_CSV', '1,000행', '500행', '최종대사_수정_누적.csv']
          for name, text in docs.items():
              missing = [x for x in common if x not in text]
              if missing:
                  raise SystemExit(f'{name}: missing lifecycle terms {missing}')
              if '화자 → 청자' not in text and 'A → B' not in text:
                  raise SystemExit(f'{name}: directional relationship rule missing')
          old_layout = '├─ .github/\n├─ docs/\n├─ source/\n├─ staging/\n├─ tests/\n├─ tools/\n├─ work/'
          for name in ('operating', 'agents'):
              if old_layout in docs[name]:
                  raise SystemExit(f'{name}: obsolete generic required layout remains')
          b = docs['bootstrap']
          lifecycle_block = b[b.find('## 핵심 원칙'):b.find('## 신규 프로젝트는 게임 전용 폴더부터 만든다')]
          sequence = ['최소 한글 출력', '전체 일본어 원문 추출', '안정 row_key', '게임 전용 검수 프로그램', '번역 전 0단계', 'Google Drive']
          positions = [lifecycle_block.find(x) for x in sequence]
          if any(x < 0 for x in positions) or positions != sorted(positions):
              raise SystemExit(f'bootstrap ordering invalid: {list(zip(sequence, positions))}')
          print('POST_PATCH_VERIFY_OK')
          PY

      - name: Commit lifecycle update and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-lifecycle-policy.yml .github/workflows/one-shot-lifecycle-policy-v2.yml scripts/one-shot-lifecycle-policy.py
          git add CODEX-LOCALIZATION-BOOTSTRAP.md workflow/PROJECT-OPERATING-MODEL.md review/PRE-TRANSLATION-SETUP.md templates/AGENTS.template.md
          git diff --cached --check
          git commit -m "docs: align localization project lifecycle"
          git push origin HEAD:main
