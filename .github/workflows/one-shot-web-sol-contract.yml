name: Apply verified Web Sol DevSpace contract

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-web-sol-contract.yml

permissions:
  contents: write

jobs:
  patch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify policies
        run: python scripts/one-shot-web-sol-contract.py

      - name: Commit policy update and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-web-sol-contract.yml scripts/one-shot-web-sol-contract.py
          git add CODEX-LOCALIZATION-BOOTSTRAP.md codex-auto-trigger/SKILL.md templates/AGENTS.template.md workflow/SOL-LUNA-AGENT-POLICY.md workflow/WEB-SOL-DEVSPACE-OPERATING-CONTRACT.md
          git diff --cached --check
          git commit -m "docs: record verified Web Sol DevSpace operating contract"
          git push origin HEAD:main
