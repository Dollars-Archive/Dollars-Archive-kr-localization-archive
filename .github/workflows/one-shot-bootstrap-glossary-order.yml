name: Apply bootstrap glossary order

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-bootstrap-glossary-order.yml

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bootstrap glossary order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('CODEX-LOCALIZATION-BOOTSTRAP.md')
          text = p.read_text(encoding='utf-8')

          anchor1 = """**이 0단계는 프로젝트 생성 직후가 아니라, 초기 기술 안전성 게이트를 통과하고 전체 일본어 원문·안정 `row_key`·`category/subcategory` 원장과 게임 전용 검수 프로그램을 준비한 뒤 수행합니다.** 그래야 아이템·시스템·튜토리얼·캐릭터 대사 등 문자열의 실제 기능과 반복 빈도를 본 상태에서 기준자료를 만들 수 있습니다.\n"""
          insert1 = anchor1 + """\n**게임 전용 검수 프로그램과 전체 원장·카테고리 준비가 끝나기 전에는 캐릭터명·아이템명·세계관 용어를 최종 확정값으로 잠그지 않습니다.** 먼저 조사된 자료가 있으면 삭제하지 않고 `LOCAL_DRAFT_ONLY`, `provisional`, `HOLD` 상태의 초안으로 보존한 뒤, 전체 원장과 분류를 확인하고 0단계에서 다시 검증해 확정합니다.\n\n캐릭터명·아이템명·지명·조직명·스킬명·시스템명처럼 게임 전체에서 반복되는 핵심 용어는 0단계에서 우선 확정해 **일반 대사·튜토리얼·설명·도감·UI 등 다른 카테고리에서도 같은 표기를 일관되게 사용**합니다.\n"""
          if text.count(anchor1) != 1:
              raise SystemExit(f'anchor1 count={text.count(anchor1)}')
          text = text.replace(anchor1, insert1, 1)

          anchor2 = "1차·2차·3차 지시문은 물리적으로 분리하고 서로의 지시문을 섞지 않습니다."
          insert2 = anchor2 + "\n\n단, **1차·2차·3차 검수 모두 `01_최신_용어집`을 공통 기준으로 반드시 참고합니다.** 캐릭터명·아이템명·지명·스킬명·시스템명 등 이미 확정된 고정 용어는 각 차수에서 임의로 다른 번역으로 바꾸지 않습니다. 새 용어가 발견되거나 기존 확정 용어와 실제 원문이 충돌하는 경우에만 후보 / `provisional` / `HOLD`로 올려 재검토합니다."
          if text.count(anchor2) != 1:
              raise SystemExit(f'anchor2 count={text.count(anchor2)}')
          text = text.replace(anchor2, insert2, 1)

          anchor3 = "**1차·2차·3차는 서로 다른 행 구간을 나눠 맡는 것이 아닙니다. 각 차수에서 전체 대사집을 다시 검수합니다.** 마지막 잔여 블록을 제외하면 기본 묶음 크기 1,000 / 1,000 / 500을 유지합니다."
          insert3 = anchor3 + "\n\n세 차수 모두 Google Drive의 `01_최신_용어집`을 확인하며, 0단계에서 확정한 캐릭터·아이템·세계관 고정 용어를 동일하게 유지합니다."
          if text.count(anchor3) != 1:
              raise SystemExit(f'anchor3 count={text.count(anchor3)}')
          text = text.replace(anchor3, insert3, 1)

          p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify bootstrap
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('CODEX-LOCALIZATION-BOOTSTRAP.md').read_text(encoding='utf-8')
          required = [
              '게임 전용 검수 프로그램과 전체 원장·카테고리 준비가 끝나기 전에는',
              'LOCAL_DRAFT_ONLY',
              '일반 대사·튜토리얼·설명·도감·UI',
              '1차·2차·3차 검수 모두 `01_최신_용어집`을 공통 기준으로 반드시 참고합니다.',
              '이미 확정된 고정 용어는 각 차수에서 임의로 다른 번역으로 바꾸지 않습니다.',
              '세 차수 모두 Google Drive의 `01_최신_용어집`을 확인하며',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'missing required text: {missing}')

          order = [
              '전체 일본어 원문 추출',
              '안정 row_key + category/subcategory 원장',
              '게임 전용 검수 프로그램',
              '번역 전 0단계 기준자료',
              'Google Drive 휴대폰/웹 검수 작업장',
          ]
          block = text[text.index('## 핵심 원칙'):text.index('## 신규 프로젝트는 게임 전용 폴더부터 만든다')]
          pos = [block.index(x) for x in order]
          if pos != sorted(pos):
              raise SystemExit(f'lifecycle order invalid: {list(zip(order, pos))}')
          print('BOOTSTRAP_GLOSSARY_ORDER_VERIFY_OK')
          PY

      - name: Commit bootstrap update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-bootstrap-glossary-order.yml
          git add CODEX-LOCALIZATION-BOOTSTRAP.md
          git diff --cached --check
          git commit -m "docs: lock glossary usage across review passes"
          git push origin HEAD:main
