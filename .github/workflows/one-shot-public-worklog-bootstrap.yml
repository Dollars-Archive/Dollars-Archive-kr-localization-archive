name: One-shot public worklog bootstrap patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-public-worklog-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch localization bootstrap
        run: python .github/scripts/one_shot_public_worklog_patch.py bootstrap

      - name: Commit localization bootstrap
        run: |
          git add CODEX-LOCALIZATION-BOOTSTRAP.md
          git diff --cached --check
          git commit -m "docs: connect public worklog to localization bootstrap"

      - name: Patch AGENTS template
        run: python .github/scripts/one_shot_public_worklog_patch.py agents

      - name: Commit AGENTS template
        run: |
          git add templates/AGENTS.template.md
          git diff --cached --check
          git commit -m "docs: add public worklog rules to project template"

      - name: Push commits
        run: git push origin HEAD:main
